  window.API_TOKEN = "__API_TOKEN__";
  (function () {
    var h = document.documentElement, c = false;
    try { var t = localStorage.getItem("uh-theme"); if (t === "light" || t === "dark") h.dataset.theme = t; c = localStorage.getItem("uh-side") === "1"; } catch (e) {}
    var w = window.innerWidth, m = w <= 760 ? "phone" : w <= 1100 ? "tablet" : "desktop";
    h.classList.add("mode-" + m);
    if (c) h.classList.add("side-collapsed");
    if (m === "tablet" || (m === "desktop" && c)) h.classList.add("is-rail");
  })();
  document.documentElement.classList.add("no-anim");
</script>

<div id="app">
  <aside class="side" id="side">
    <div class="brand">
      <img src="icon.svg" alt="">
      <div class="brand-txt">
        <b>منظّم الجامعة</b>
        <small id="who">UniHub</small>
      </div>
      <button class="drawer-close" id="drawer-close" aria-label="إغلاق القائمة"><svg class="icon"><use href="#i-x"/></svg></button>
    </div>
    <nav id="nav">
      <div class="nav-label">الدراسة</div>
      <a data-view="home"><svg class="icon"><use href="#i-home"/></svg><span>الرئيسية</span></a>
      <a data-view="search"><svg class="icon"><use href="#i-search"/></svg><span>البحث</span></a>
      <a data-view="courses"><svg class="icon"><use href="#i-book"/></svg><span>المواد</span></a>
      <a data-view="assignments"><svg class="icon"><use href="#i-tasks"/></svg><span>الواجبات</span><em id="badge-assign" class="badge hide"></em></a>
      <a data-view="notifications"><svg class="icon"><use href="#i-bell"/></svg><span>الإشعارات</span><em id="badge-notif" class="badge hide"></em></a>
      <a data-view="images"><svg class="icon"><use href="#i-images"/></svg><span>صوري</span></a>
      <div class="nav-label">الأدوات</div>
      <a data-view="import"><svg class="icon"><use href="#i-tree"/></svg><span>ترتيب مجلد قديم</span></a>
      <a data-view="feedback"><svg class="icon"><use href="#i-message"/></svg><span>الملاحظات الفنية</span><em id="badge-fb" class="badge gold hide"></em></a>
      <a data-view="settings"><svg class="icon"><use href="#i-sliders"/></svg><span>الإعدادات</span></a>
      <div class="nav-label row-label"><span>روابطي</span><button class="nav-edit" data-go="links" title="تعديل الروابط"><svg class="icon"><use href="#i-pencil"/></svg></button></div>
      <div id="nav-links"></div>
    </nav>
    <div class="side-foot">
      <div class="syncbox">
        <div class="sync-row">
          <span id="sync-dot" class="dot"></span>
          <div class="sync-txt"><div id="sync-line">—</div><div id="index-line"></div></div>
          <button id="btn-sync" class="icon-btn" title="مزامنة الآن"><svg class="icon"><use href="#i-refresh"/></svg></button>
        </div>
      </div>
      <div class="theme-switch" id="theme-switch" role="radiogroup" aria-label="المظهر">
        <button data-theme-set="light" title="فاتح"><svg class="icon"><use href="#i-sun"/></svg></button>
        <button data-theme-set="auto" title="تلقائي حسب النظام"><svg class="icon"><use href="#i-monitor"/></svg></button>
        <button data-theme-set="dark" title="داكن"><svg class="icon"><use href="#i-moon"/></svg></button>
      </div>
      <div class="ver" id="ver"></div>
    </div>
  </aside>

  <main>
    <header class="top">
      <button class="menu-btn" id="menu-btn" title="القائمة (Ctrl+B)" aria-label="القائمة" aria-controls="side"><svg class="icon"><use href="#i-menu"/></svg></button>
      <div class="searchbar">
        <svg class="icon"><use href="#i-search"/></svg>
        <input id="q" type="search" placeholder="ابحث في كل المحاضرات والواجبات والملفات…" autocomplete="off" spellcheck="false">
        <kbd>/</kbd>
      </div>
      <div class="quickbar" id="quickbar">
        <button class="qb-btn" id="qb-notif" title="الإشعارات" aria-haspopup="true"><svg class="icon"><use href="#i-bell"/></svg><em id="qb-badge" class="qb-dot hide"></em></button>
        <button class="qb-btn" id="qb-settings" title="الإعدادات"><svg class="icon"><use href="#i-gear"/></svg></button>
        <button class="qb-account" id="qb-account" title="الحساب" aria-haspopup="true"><span class="qb-av" id="qb-av"><svg class="icon"><use href="#i-user"/></svg></span><span class="qb-name" id="qb-name">حسابي</span><svg class="icon chev"><use href="#i-chev-down"/></svg></button>
        <button class="qb-btn danger" id="qb-power" title="إيقاف البرنامج"><svg class="icon"><use href="#i-power"/></svg></button>
        <div class="pop hide" id="pop"></div>
      </div>
    </header>
    <div id="banners"></div>
    <section id="view"></section>
  </main>
  <div class="scrim" id="scrim"></div>
  <div class="tabbar" id="tabbar" role="navigation" aria-label="التنقل السريع">
    <a data-tab="home"><svg class="icon"><use href="#i-home"/></svg><span>الرئيسية</span></a>
    <a data-tab="courses"><svg class="icon"><use href="#i-book"/></svg><span>المواد</span></a>
    <a data-tab="assignments"><svg class="icon"><use href="#i-tasks"/></svg><span>الواجبات</span><em id="tb-assign" class="badge hide"></em></a>
    <a data-tab="images"><svg class="icon"><use href="#i-images"/></svg><span>صوري</span></a>
    <a data-tab="more"><svg class="icon"><use href="#i-menu"/></svg><span>المزيد</span><em id="tb-more" class="badge gold hide"></em></a>
  </div>
</div>
<div id="modal" class="modal hide"></div>
<div id="toast" class="toast hide"></div>
<script src="app.js"></script>
</body>
</html>
