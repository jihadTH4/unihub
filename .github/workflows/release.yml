name: إصدار جديد

# ينشر إصداراً تلقائياً في ثلاث حالات:
# 1) رفع تعديل على main يغيّر ملف VERSION (الطريقة المعتادة: Claude يرفع الرقم الجديد وملاحظاته)
# 2) رفع وسم مثل v1.2.0
# 3) نشر Release يدوياً من صفحة GitHub
on:
  push:
    branches: [main]
    paths: [VERSION]
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: تحديد رقم الإصدار
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_KEY: ${{ secrets.ANDROID_KEYSTORE != '' && 'yes' || '' }}
        run: |
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v$(tr -d ' \r\n' < VERSION)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          # a release that already has its files attached needs nothing more
          # (the Android app is built only when the signing key secret exists)
          ASSETS=$(gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null || true)
          if echo "$ASSETS" | grep -qx UniHub.exe && { echo "$ASSETS" | grep -qx UniHub.apk || [ -z "$HAS_KEY" ]; }; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: الأيقونة ومعلومات الإصدار
        if: steps.v.outputs.skip != 'true'
        run: python3 tools/winres.py "${{ steps.v.outputs.version }}"

      - name: البناء لويندوز
        if: steps.v.outputs.skip != 'true'
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          go vet ./...
          go build -trimpath \
            -ldflags "-H windowsgui -s -w -X main.Version=${{ steps.v.outputs.version }} -X main.UpdateRepo=${{ github.repository }}" \
            -o dist/UniHub.exe .

      - uses: actions/setup-java@v5
        if: steps.v.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        if: steps.v.outputs.skip != 'true'
        with:
          gradle-version: "8.14.3"

      - name: البناء لأندرويد
        if: steps.v.outputs.skip != 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE }}
          UNIHUB_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::لم يُبنَ تطبيق أندرويد: أضف ANDROID_KEYSTORE و ANDROID_KEYSTORE_PASSWORD في Settings > Secrets and variables > Actions"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/unihub.jks"
          export UNIHUB_KEYSTORE="$RUNNER_TEMP/unihub.jks"
          tools/build-android.sh "${{ steps.v.outputs.version }}" release "${{ github.repository }}"
          rm -f "$RUNNER_TEMP/unihub.jks"

      - name: ملف التحقق والحزمة المضغوطة
        if: steps.v.outputs.skip != 'true'
        run: |
          cd dist
          sha256sum UniHub.exe $( [ -f UniHub.apk ] && echo UniHub.apk ) > checksums.txt
          cat checksums.txt
          cp ../docs/README-AR.txt . 2>/dev/null || true
          zip -9 UniHub-Windows.zip UniHub.exe README-AR.txt checksums.txt

      - name: نشر الملفات في صفحة الإصدار
        if: steps.v.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            if [ -f RELEASE_NOTES.md ] && [ "${{ github.ref_type }}" != "tag" ]; then
              NOTES=$(cat RELEASE_NOTES.md)
            else
              NOTES=$(git tag -l --format='%(contents)' "$TAG")
            fi
            [ -z "$NOTES" ] && NOTES="إصدار $TAG"
            gh release create "$TAG" --target "$GITHUB_SHA" --title "منظّم الجامعة $TAG" --notes "$NOTES"
          fi
          FILES="dist/UniHub.exe dist/checksums.txt dist/UniHub-Windows.zip"
          [ -f dist/UniHub.apk ] && FILES="$FILES dist/UniHub.apk"
          gh release upload "$TAG" $FILES --clobber
